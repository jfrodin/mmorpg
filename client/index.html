<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMORPG — dev</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1a1f1a;
        overflow: hidden;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      #auth-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #10140f;
        font-family: system-ui, sans-serif;
        color: #e8e4d8;
      }
      #auth-overlay form {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        width: 220px;
      }
      #auth-overlay form.wide {
        width: 300px;
      }
      #auth-overlay .preview-row {
        display: flex;
        justify-content: center;
        margin-bottom: 0.2rem;
      }
      #auth-overlay .swatch-group {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      #auth-overlay .swatch-group label {
        font-size: 0.75rem;
        color: #9fb89f;
      }
      #auth-overlay .swatches {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      #auth-overlay .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
      }
      #auth-overlay .swatch.selected {
        border-color: #f0ece0;
      }
      #auth-overlay input {
        padding: 0.5rem;
        border-radius: 4px;
        border: 1px solid #444;
        background: #1e241a;
        color: inherit;
      }
      #auth-overlay button {
        padding: 0.5rem;
        border-radius: 4px;
        border: none;
        background: #3a6b47;
        color: white;
        cursor: pointer;
      }
      #auth-overlay .toggle {
        background: none;
        color: #9fb89f;
        text-decoration: underline;
        padding: 0;
      }
      #auth-overlay .error {
        color: #d97f6a;
        min-height: 1.2em;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="auth-overlay"></div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
